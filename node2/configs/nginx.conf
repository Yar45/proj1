# Внешний HTTP (порт 80) -> Редирект на HTTPS + ACME challenge для продления
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name {{DOMAIN}};

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Внутренний HTTPS (порт 8080) -> Сюда Xray REALITY сбрасывает не-VPN трафик
server {
    listen 127.0.0.1:{{NGINX_FALLBACK_PORT}} ssl default_server;
    listen [::1]:{{NGINX_FALLBACK_PORT}} ssl default_server;
    server_name {{DOMAIN}};

    ssl_certificate /etc/letsencrypt/live/{{DOMAIN}}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{DOMAIN}}/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Защита от утечки пути через Referer и сниффинга MIME
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 1. Главная страница (Сайт-заглушка)
    location / {
        root /var/www/html;
        index index.html;
    }

    # 2. Сервис подписок 3x-ui (через 443 порт)
    location {{SUB_PATH}} {
        proxy_pass http://127.0.0.1:{{SUB_PORT}}{{SUB_PATH}};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 3. Секретный 16-значный путь админ-панели 3x-ui (через 443 порт с поддержкой WebSocket)
    location {{PANEL_WEB_BASE_PATH}} {
        proxy_pass http://127.0.0.1:{{PANEL_PORT}}{{PANEL_WEB_BASE_PATH}};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
